name: Build Plugin

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

env:
  GO_VERSION: "1.27.0"

jobs:
  build:
    name: Build llamacpp-plugin.so
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test provider
        run: go test ./provider/...

      - name: Build plugin
        run: |
          cd plugin/llamacpp-so
          go build -buildmode=plugin -o ../../build/llamacpp-plugin.so .
          cd ../..
          ls -lh build/llamacpp-plugin.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llamacpp-plugin
          path: build/llamacpp-plugin.so

  release:
    name: Publish to release
    runs-on: ubuntu-24.04
    needs: [build]
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: llamacpp-plugin
          path: build/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            build/llamacpp-plugin.so --clobber
