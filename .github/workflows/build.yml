name: Build Plugin

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]

env:
  GO_VERSION: "1.27.0"

jobs:
  build:
    name: Build llamacpp-plugin.so
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test provider
        run: go test ./provider/...

      - name: Build plugin
        run: |
          cd plugin/llamacpp-so
          go build -buildmode=plugin -o ../../build/llamacpp-plugin.so .
          cd ../..
          ls -lh build/llamacpp-plugin.so

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: llamacpp-plugin
          path: build/llamacpp-plugin.so

  release:
    name: Publish to release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build plugin
        run: |
          cd plugin/llamacpp-so
          go build -buildmode=plugin -o ../../build/llamacpp-plugin.so .
          cd ../..
          ls -lh build/llamacpp-plugin.so

      - name: Create release and upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Bifrost llama.cpp plugin ${{ github.ref_name }}"
          body: "llama.cpp provider plugin for Bifrost with verbatim reasoning-effort passthrough and true SSE streaming."
          files: build/llamacpp-plugin.so
